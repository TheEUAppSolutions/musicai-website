<!doctype html>
<html lang="en" class="no-js">
<head>
{{head}}
<title>Open Stem Split</title>
<meta name="description" content="This link opens directly in the Stem Split app on iPhone and iPad.">
<meta name="robots" content="noindex">
</head>
<body>
{{icons}}
{{header}}

<!-- Universal Link target (see /.well-known/apple-app-site-association).
     With the app installed, iOS opens /stemsplit links straight in the app and
     this page is never shown. It's the fallback for everyone else. -->
<main id="main">
  <div class="wrap center-card">
    <img class="app-icon" src="/assets/img/icon.svg" alt="Stem Split app icon" width="108" height="108">
    <h1 class="h-md">Open Stem Split on your phone</h1>
    <p>This link opens directly in the Stem Split app. Tap it from your iPhone or iPad.</p>
    <p class="promo" id="promo" hidden></p>
    <a class="appstore" href="https://apps.apple.com/app/id6742150522" aria-label="Get Stem Split on the App Store"><img src="/assets/img/app-store-badge.svg" alt="Download on the App Store" width="162" height="54"></a>
    <p class="small">Already have the app? Tap the link from Mail, Messages or Notes. Pasting it into Safari's address bar doesn't open apps.</p>
  </div>
</main>

{{footer}}
<script src="/assets/js/site.js?v={{version}}"></script>
<script>
  // Show the offer code so it can be typed in by hand if the link doesn't open the app.
  const code = new URLSearchParams(location.search).get("promo_code");
  if (code) {
    const el = document.getElementById("promo");
    el.textContent = "Your code: " + code.slice(0, 40);
    el.hidden = false;
  }
</script>
</body>
</html>
